name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Loyihani topish
        id: proj
        run: |
          if [ ! -f build.gradle ]; then
            for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d _proj; done
            DIR=$(dirname "$(find _proj -name build.gradle | head -1)")
          else
            DIR=.
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Loyiha: $DIR"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
